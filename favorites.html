<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12a150">
  <title>즐겨찾기 · SaveCharge</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar"><h1>즐겨찾기</h1></header>

  <div class="fav-tabs">
    <div class="segmented" role="tablist" aria-label="즐겨찾기 구분">
      <button type="button" role="tab" id="tab-places" aria-controls="panel-places" data-tab="places" aria-pressed="true" aria-selected="true">장소</button>
      <button type="button" role="tab" id="tab-stations" aria-controls="panel-stations" data-tab="stations" aria-pressed="false" aria-selected="false">업장</button>
      <button type="button" role="tab" id="tab-alerts" aria-controls="panel-alerts" data-tab="alerts" aria-pressed="false" aria-selected="false">가격 알림</button>
    </div>
  </div>

  <main class="page">
    <!-- 장소 -->
    <section id="panel-places" role="tabpanel" aria-labelledby="tab-places" class="stack">
      <ul class="card card--flush list" id="place-fixed"></ul>
      <h2 class="section-title">내 장소</h2>
      <ul class="card card--flush list" id="place-custom"></ul>
      <button type="button" class="btn btn--block" id="btn-add-place" data-icon="plus">장소 추가</button>
    </section>

    <!-- 업장 -->
    <section id="panel-stations" role="tabpanel" aria-labelledby="tab-stations" class="stack" hidden>
      <p class="small muted" id="station-base">-</p>
      <ul class="card card--flush list" id="station-list"></ul>
    </section>

    <!-- 알림 -->
    <section id="panel-alerts" role="tabpanel" aria-labelledby="tab-alerts" class="stack" hidden>
      <div class="banner" id="push-banner">
        <span data-icon="bell"></span>
        <span class="grow">브라우저 알림을 허용하면 목표가 도달 시 바로 알려드려요.</span>
        <button type="button" class="btn btn--sm" id="btn-push">허용</button>
      </div>
      <ul class="card card--flush list" id="alert-list"></ul>
    </section>
  </main>

  <nav data-tabbar="favorites"></nav>
</div>

<!-- 시트: 장소 검색/등록 -->
<section class="sheet" id="sheet-place" role="dialog" aria-modal="true" aria-labelledby="place-title" hidden>
  <div class="sheet__handle"></div>
  <div class="sheet__head">
    <h2 id="place-title">장소 등록</h2>
    <button type="button" class="icon-btn" data-close-sheet aria-label="닫기" data-icon="close"></button>
  </div>
  <div class="sheet__body">
    <label class="field" id="place-name-field">
      <span class="field__label">장소 이름</span>
      <input class="input" id="place-name" maxlength="20" placeholder="예: 부모님 댁">
    </label>
    <div class="search-box">
      <span data-icon="search"></span>
      <input class="input" type="search" id="place-q" placeholder="주소 또는 장소명" autocomplete="off" aria-label="주소 또는 장소명">
    </div>
    <ul class="card card--flush list" id="place-results"></ul>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/cost.js"></script>
<script src="js/ui.js"></script>
<script src="js/favorites.js"></script>
</body>
</html>
