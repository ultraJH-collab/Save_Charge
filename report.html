<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12a150">
  <title>절약 리포트 · SaveCharge</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar"><h1>절약 리포트</h1></header>

  <main class="page">
    <div class="banner banner--warn" id="sample-banner" hidden>
      <span data-icon="info"></span>
      <span>아직 길안내 기록이 없어 <b>예시 데이터</b>를 보여드려요. 추천 업장으로 길안내를 시작하면 실제 기록이 쌓입니다.</span>
    </div>

    <div class="month-nav">
      <button type="button" class="icon-btn" id="m-prev" aria-label="이전 달" data-icon="back"></button>
      <p class="month-nav__label" id="m-label" aria-live="polite">-</p>
      <button type="button" class="icon-btn" id="m-next" aria-label="다음 달" data-icon="chevron"></button>
    </div>

    <section class="card stat-hero" aria-labelledby="hero-label">
      <p class="stat-hero__label" id="hero-label">이번 달 아낀 돈</p>
      <p class="stat-hero__value num" id="hero-value">-</p>
      <p class="stat-hero__sub" id="hero-sub">-</p>
    </section>

    <section class="stats" aria-label="월간 요약">
      <div class="card stat"><p class="stat__label">주유·충전 횟수</p><p class="stat__value num" id="s-count">-</p></div>
      <div class="card stat"><p class="stat__label">총 지출</p><p class="stat__value num" id="s-spend">-</p></div>
      <div class="card stat"><p class="stat__label">회당 평균 절약</p><p class="stat__value num" id="s-avg">-</p></div>
      <div class="card stat"><p class="stat__label">누적 절약 (전체)</p><p class="stat__value num brand-text" id="s-total">-</p></div>
    </section>

    <section aria-labelledby="bars-title">
      <h2 class="section-title" id="bars-title">최근 6개월 절약액</h2>
      <div class="card bars" id="bars"></div>
    </section>

    <section aria-labelledby="trips-title">
      <h2 class="section-title" id="trips-title">이번 달 기록</h2>
      <ul class="card card--flush list" id="trips"></ul>
    </section>
  </main>

  <nav data-tabbar="report"></nav>
</div>

<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/report.js"></script>
</body>
</html>
